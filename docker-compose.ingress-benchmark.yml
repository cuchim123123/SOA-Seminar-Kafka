name: ingress-benchmark

services:
  kafka-bench:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    container_name: kafka-bench
    hostname: kafka-bench
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-bench:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-bench:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L622nShTUiAnsYh0-X41w"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms768m -Xmx768m"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    volumes:
      - kafka_bench_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-bench:
    image: redis:7-alpine
    container_name: redis-bench
    hostname: redis-bench
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "no", "--maxmemory", "1800mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    volumes:
      - redis_bench_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq-bench:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-bench
    hostname: rabbitmq-bench
    ports:
      - "5552:5552"
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_bench_data:/var/lib/rabbitmq
      - ./docker/ingress-benchmark/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/ingress-benchmark/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  kafka_bench_data:
  redis_bench_data:
  rabbitmq_bench_data:
